name: Check source integrations

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate Notion and Zoho access
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          response="$(curl --silent --show-error --request GET \
            --header "Authorization: Bearer $ADMIN_TOKEN" \
            --write-out $'\n%{http_code}' \
            "$WORKER_URL/admin/integrations")"
          body="${response%$'\n'*}"
          status="${response##*$'\n'}"
          printf '%s\n' "$body" | jq .
          test "$status" = "200"
