name: Inspect Zoho message sizes

on:
  workflow_dispatch:
    inputs:
      message_id:
        description: Numeric Zoho message ID from the failure log
        required: true
        type: string
      folder:
        description: Configured source folder
        required: true
        type: choice
        options:
          - Inbox
          - Dust Wave
          - Newsletter
          - Notification

permissions:
  contents: read

jobs:
  inspect:
    uses: ./.github/workflows/admin-request.yml
    with:
      operation: inspect-zoho-message
      message_id: ${{ inputs.message_id }}
      folder: ${{ inputs.folder }}
    secrets: inherit
