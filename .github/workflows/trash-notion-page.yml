name: Trash one Notion page

on:
  workflow_dispatch:
    inputs:
      page_id:
        description: Exact Notion page ID to move to trash
        required: true
        type: string

permissions:
  contents: read

jobs:
  trash:
    uses: ./.github/workflows/admin-request.yml
    with:
      operation: trash-notion
      page_id: ${{ inputs.page_id }}
    secrets: inherit
