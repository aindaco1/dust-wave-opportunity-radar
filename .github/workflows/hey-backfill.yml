name: HEY seven-day backfill

on:
  workflow_dispatch:
    inputs:
      days:
        description: Number of days to import
        type: number
        required: true
        default: 7

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Sealjay/mcp-hey
          ref: 3742078955a65bf9dafa8c56b436a799ba8ece1b
          path: mcp-hey
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6
      - run: bun install --frozen-lockfile
        working-directory: mcp-hey
      - name: Apply audited HEY pagination compatibility patch
        working-directory: mcp-hey
        run: |
          git apply --check "$GITHUB_WORKSPACE/patches/mcp-hey-pagination.patch"
          git apply "$GITHUB_WORKSPACE/patches/mcp-hey-pagination.patch"
      - name: Test patched HEY pagination
        working-directory: mcp-hey
        run: bun test src/__tests__/pagination.test.ts
      - name: Install HEY session
        shell: bash
        env:
          HEY_COOKIES_JSON: ${{ secrets.HEY_COOKIES_JSON }}
        run: node -e 'const fs=require("fs"); fs.mkdirSync("mcp-hey/data",{recursive:true}); fs.writeFileSync("mcp-hey/data/hey-cookies.json",process.env.HEY_COOKIES_JSON,{mode:0o600})'
      - name: Import HEY messages
        run: npm run backfill:hey
        env:
          HEY_MCP_ROOT: ${{ github.workspace }}/mcp-hey
          WORKER_URL: ${{ vars.WORKER_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          BACKFILL_DAYS: ${{ inputs.days }}
          HEY_BACKFILL_TARGETS_JSON: ${{ secrets.HEY_BACKFILL_TARGETS_JSON }}
