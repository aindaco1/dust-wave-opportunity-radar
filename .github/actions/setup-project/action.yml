name: Set up project
description: Install the repository's reviewed Node version and locked dependencies.

inputs:
  cache-dependencies:
    description: Disable for disposable credentialed HEY jobs.
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version-file: .nvmrc
        cache: ${{ inputs.cache-dependencies == 'true' && 'npm' || '' }}
        package-manager-cache: ${{ inputs.cache-dependencies == 'true' }}
    - name: Install locked dependencies
      shell: bash
      run: npm ci
